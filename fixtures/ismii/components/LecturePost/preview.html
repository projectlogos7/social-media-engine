<!-- @dsCard group="Showcase" height=460 page="true" subtitle="Square post, sandstone frame" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lecture post</title>
<style>
  body{margin:0;background:var(--ground);display:flex;gap:var(--space-5);padding:var(--space-3);font-family:var(--font-sans);}
  .post{position:relative;width:432px;height:432px;flex:none;background:var(--sandstone-red) url('/_blob/662604b3e1dd3fbc0f1c0d8c09377ba7') center/cover;}
  .post.iv{background:var(--marble-ivory) url('/_blob/39f7520464dfe355d93064b827b3b42b') center/cover;}
  .content{position:absolute;left:32px;right:32px;top:40px;height:300px;display:flex;flex-direction:column;}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--marble-ivory);}
  .title{font-family:var(--font-serif);font-weight:600;font-size:38px;line-height:40px;margin:var(--space-3) 0 0;color:var(--marble-ivory);}
  .who{margin-top:auto;font-size:15px;font-weight:600;color:var(--marble-ivory);}
  .aff{font-size:13px;color:var(--marble-ivory);margin-top:2px;}
  .when{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--marble-ivory);margin-top:var(--space-3);}
  .iv .eyebrow{color:var(--sandstone-red)} .iv .title,.iv .who,.iv .aff,.iv .when{color:var(--india-ink)}
</style></head>
<body>
<div class="post" role="img" aria-label="Sample lecture post on sandstone">
  <div class="content">
    <div class="eyebrow">ISMII Lecture</div>
    <h1 class="title">Title of the lecture, set in two lines</h1>
    <div class="who">Speaker Name</div>
    <div class="aff">Department, University</div>
    <div class="when">SAT 9 JAN 2027 · 11:00 CT · ZOOM</div>
  </div>
</div>
<div class="post iv" role="img" aria-label="Sample lecture post on ivory">
  <div class="content">
    <div class="eyebrow">ISMII Seminar</div>
    <h1 class="title">A text-led post on the ivory frame</h1>
    <div class="who">Speaker Name</div>
    <div class="aff">Department, University</div>
    <div class="when">SAT 19 DEC 2026 · AMERICAN ISLAMIC COLLEGE</div>
  </div>
</div>
<script>/* static showcase */</script>
</body></html>
